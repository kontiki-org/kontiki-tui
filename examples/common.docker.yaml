kontiki:
  amqp:
    url: amqp://guest:guest@rabbitmq/
  registration:
    # Give the registry a moment to boot before services publish.
    delay: 3

logging:
  directory: logs
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
    file:
      class: logging.FileHandler
      level: INFO
  root:
    handlers: [console, file]
    level: INFO
