kontiki:
  registration:
    group: platform

kontiki-monitor:
  category: kontiki.registry
  poll_interval_seconds: 10
  silences_path: logs/silences.json
  expected_services:
    RpcService:
      min_active: 1
    SimpleEventService:
      min_active: 1
    subscription-service:
      min_active: 1
    alert-engine-service:
      min_active: 1
    email-notifier-service:
      min_active: 1
